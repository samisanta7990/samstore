<!DOCTYPE html><html lang="am"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sam Store</title><link rel="icon" id="fav" type="image/png"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><style>/*SAMCSS*/:root{--a:#F2B705;--bg:#11121B;--b2:#181A26;--t:#ECEDF3;--h:#8C90A6;--l:#ffffff14;--ok:#22C3A6;--no:#E6553A}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 'Noto Sans Ethiopic',system-ui,sans-serif}
main{max-width:560px;margin:auto;padding:18px 16px 60px}h1{font-size:22px;margin:4px 0}.sub{color:var(--h);margin:0 0 16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card,.row{background:var(--b2);border:1px solid var(--l);border-radius:14px;padding:14px;cursor:pointer;color:var(--t);text-align:left;font:inherit}
.card{min-height:96px;display:flex;flex-direction:column;justify-content:space-between}.card b{font-size:26px}
.rows{display:flex;flex-direction:column;gap:9px}.row{display:flex;justify-content:space-between;gap:10px}.p{color:var(--a);font-weight:700;white-space:nowrap}
.back{background:none;border:0;color:var(--h);padding:0 0 12px;font:inherit;cursor:pointer}
label{display:block;color:var(--h);margin:12px 0 6px;font-size:13px}
input{width:100%;background:var(--b2);border:1px solid var(--l);color:var(--t);border-radius:12px;padding:13px;font:inherit}
.btn{width:100%;border:0;border-radius:14px;padding:14px;margin-top:16px;font:600 16px inherit;background:var(--a);color:#1A1300;cursor:pointer}
.btn.s{background:var(--b2);color:var(--t);border:1px solid var(--l)}.btn:disabled{opacity:.5}
.box{background:var(--b2);border:1px solid var(--l);border-radius:14px;padding:14px;margin:12px 0}
.hint{background:#F2B7051a;border:1px solid #F2B70540;border-radius:12px;padding:12px;margin:12px 0}
.err{color:var(--no);margin:10px 0}.big{font-size:20px;font-weight:700;color:var(--a)}
.st{font-size:18px;font-weight:700;margin:8px 0}.mini{display:flex;gap:8px}.mini .btn{margin-top:10px;padding:11px}
.tabs{display:flex;gap:6px;margin:12px 0;overflow-x:auto}.tabs button{flex:none;padding:9px 12px;border-radius:10px;border:1px solid var(--l);background:var(--b2);color:var(--t);font:inherit}.tabs .on{background:var(--a);color:#1A1300}
.o img{max-width:100%;border-radius:10px;margin-top:8px}.o small{color:var(--h)}.o code{user-select:all;word-break:break-all}
main{padding-bottom:90px}nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:1px solid var(--l);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;background:none;border:0;color:var(--h);padding:9px 2px;font:11px inherit;cursor:pointer}nav .on{color:var(--a)}
.pi{width:100%;max-height:260px;object-fit:cover;border-radius:10px;margin-bottom:8px}h3{margin:4px 0}.mini{align-items:center;justify-content:space-between}
.sec{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}.sec h2{margin:0;font-size:18px}.sec a{color:var(--a);cursor:pointer}
.hero{font-size:26px;font-weight:800;line-height:1.25;margin:8px 0}.k{color:var(--a);letter-spacing:.1em;font-size:12px}
[data-theme=light]{--bg:#f4f5fa;--b2:#ffffff;--t:#14151f;--h:#6a6e85;--l:#00000018}
header{max-width:560px;margin:auto;display:flex;justify-content:space-between;align-items:center;padding:12px 16px 0}header b{font-size:18px}
header button{background:var(--b2);border:1px solid var(--l);color:var(--t);border-radius:10px;padding:7px 11px;margin-left:6px;font:inherit;cursor:pointer}
nav .ctr{flex:none;width:66px;height:66px;border-radius:50%;margin:-24px 4px 4px;background:var(--b2);border:2px solid var(--l);color:var(--t)}nav .ctr.on{background:var(--a);color:#1A1300;border-color:var(--a)}
.cp{background:var(--b2);border:1px solid var(--l);color:var(--t);border-radius:8px;padding:5px 10px;margin-left:6px;font:inherit;font-size:13px;cursor:pointer}

.heroc{background:linear-gradient(135deg,#F2B70522,#22C3A614 60%,transparent),var(--b2);border:1px solid var(--l);border-radius:20px;padding:20px 18px;margin:6px 0 12px}
.heroc .hero{font-size:24px}.steps{display:flex;gap:8px;margin:12px 0}.steps div{flex:1;background:var(--b2);border:1px solid var(--l);border-radius:14px;padding:10px 8px;font-size:12px;text-align:center;color:var(--h)}
.steps i{display:block;width:24px;height:24px;line-height:24px;margin:0 auto 6px;border-radius:50%;background:var(--a);color:#1A1300;font-style:normal;font-weight:700}
.sec h2{border-left:4px solid var(--a);padding-left:10px}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.cc:active,.pcard:active,.row:active{transform:scale(.97)}.cn{font-size:22px;font-weight:800}.cpz{color:var(--a);font-weight:800;font-size:16px;margin-top:6px}
.cb{margin-top:10px;background:var(--a);color:#1A1300;border-radius:10px;text-align:center;padding:8px;font-weight:700;font-size:14px}
.hs{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}.hs::-webkit-scrollbar{display:none}
.pcard{flex:none;width:170px;scroll-snap-align:start;background:var(--b2);border:1px solid var(--l);border-radius:16px;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.pcard img,.pcard .ph{width:100%;aspect-ratio:1;object-fit:contain;background:#00000040;border-radius:12px;margin-bottom:4px;display:flex;align-items:center;justify-content:center;font-size:40px}

.row{align-items:center}.pi{aspect-ratio:1;object-fit:contain;background:#00000040;max-height:340px}
.box{border-radius:16px}

/* ===== Button animations ===== */
.btn,.cb,.cp,.row,.cc,.pcard,.card,.back,nav button,header button,.tabs button{transition:transform .15s ease,box-shadow .25s ease,filter .2s ease,background .2s ease}
.btn:active,.cb:active,.cp:active,header button:active,.tabs button:active,nav button:active{transform:scale(.94)}
@media (hover:hover){.btn:hover,.cc:hover,.pcard:hover,.row:hover{transform:translateY(-2px);filter:brightness(1.08)}}
.btn:not(.s){position:relative;overflow:hidden;box-shadow:0 6px 18px #F2B70540}
.btn:not(.s)::after,.cb::after{content:"";position:absolute;top:0;left:-70%;width:35%;height:100%;background:linear-gradient(100deg,transparent,#ffffff70,transparent);transform:skewX(-20deg);animation:shine 3.4s ease-in-out infinite;pointer-events:none}
.cb{position:relative;overflow:hidden}
.btn:disabled::after{display:none}
@keyframes shine{0%,55%{left:-70%}100%{left:140%}}
nav .ctr{animation:floaty 3s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-4px)}}
nav .ctr.on{animation:floaty 3s ease-in-out infinite,pulse 2.2s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #F2B70590}70%,100%{box-shadow:0 0 0 16px #F2B70500}}
.cc,.pcard,.steps div{animation:pop .4s ease both}
.cg .cc:nth-child(2),.hs .pcard:nth-child(2),.steps div:nth-child(2){animation-delay:.06s}
.cg .cc:nth-child(3),.hs .pcard:nth-child(3),.steps div:nth-child(3){animation-delay:.12s}
.cg .cc:nth-child(4){animation-delay:.18s}.cg .cc:nth-child(5){animation-delay:.24s}.cg .cc:nth-child(6){animation-delay:.3s}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
.tabs .on{animation:tabpop .25s ease}
@keyframes tabpop{from{transform:scale(.9)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*,*::after{animation:none!important;transition:none!important}}

.tnm{min-width:0}.tnm b{display:flex;align-items:center;gap:6px;font-size:16px}.tnm small{color:var(--h);display:block;font-size:12.5px;max-width:62vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tgm{display:flex;flex-direction:column;gap:3px;padding:6px 2px 175px}
.tdate{align-self:center;margin:10px 0 6px}.tdate span{background:#ffffff12;color:var(--h);font-size:12px;padding:3px 12px;border-radius:99px}
.tb{position:relative;max-width:80%;padding:7px 11px 6px;border-radius:16px;word-break:break-word;white-space:pre-wrap;line-height:1.35;animation:fadeUp .25s both}
.tb.in{align-self:flex-start;background:#1a2634;border-bottom-left-radius:4px;color:#e8edf3}
.tb.out{align-self:flex-end;background:linear-gradient(135deg,#F2B705,#e8a800);color:#111;border-bottom-right-radius:4px}
.tb.timg{padding:4px}.tb.timg .tt{position:absolute;right:10px;bottom:8px;background:#0008;color:#fff;border-radius:10px;padding:1px 7px;margin:0}
.tt{float:right;margin:6px 0 -2px 10px;font-size:11px;opacity:.7;display:inline-flex;gap:3px;align-items:center}.tk{font-style:normal;letter-spacing:-3px}.tk.r{color:#1d6fe8}
.tgc{position:fixed;left:0;right:0;bottom:calc(70px + env(safe-area-inset-bottom,0px));padding:8px 10px;background:rgba(8,12,20,.95);backdrop-filter:blur(10px);z-index:5;max-width:560px;margin:auto;display:flex;flex-direction:column;gap:7px}
.tgr{display:flex;align-items:center;gap:8px;background:#121a24;border:1px solid var(--l);border-radius:26px;padding:4px 4px 4px 8px}
.tgr input{flex:1;border:0!important;background:none!important;margin:0!important;box-shadow:none!important;padding:10px 6px!important;min-width:0}
.tatt{border:0;background:none;color:var(--h);padding:6px;cursor:pointer}.tatt svg,.tsend svg{width:22px;height:22px;display:block}
.tsend{border:0;width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#F2B705,#e8a800);color:#111;display:grid;place-items:center;cursor:pointer;flex:none}
.xbtn{display:inline-flex;align-items:center;gap:6px}
@media (prefers-reduced-motion:reduce){.xi,.rv,.tb,.tav.sup{animation:none!important}}
</style>

 show(`<h1 class="shimt">${L2('Sell or exchange your account','አካውንትዎን ይሽጡ ወይም ይለዋወጡ')}</h1><p class="sub">${L2('Every listing is reviewed before it goes live.','እያንዳንዱ ዝርዝር ከመታተሙ በፊት ይገመገማል።')}</p><div class="box selfrm"><label>${L2('What do you want to do?','ምን ማድረግ ይፈልጋሉ?')}</label><div class="modes"><button type="button" class="mpill on" data-m="sale" onclick="setMode('sale')">\u{1F3F7}\u{FE0F} ${L2('Sell','ሽያጭ')}</button><button type="button" class="mpill" data-m="both" onclick="setMode('both')">${XCH} ${L2('Sell or exchange (+ money)','ሽያጭ ወይም መለዋወጥ (+ ገንዘብ)')}</button><button type="button" class="mpill" data-m="swap" onclick="setMode('swap')">\u{1F91D} ${L2('Exchange only','መለዋወጥ ብቻ')}</button></div><input type="hidden" id="smode" value="sale"><label>${L2('Screenshots: account + overall rating (up to 4)','ስክሪንሾቶች፦ አካውንት + ጠቅላላ ደረጃ (እስከ 4)')}</label><input id="sf" onchange="keepF(this)" type="file" accept="image/*" multiple><label>${L2('Overall rating (OVR)','ጠቅላላ ደረጃ (OVR)')}</label><input id="so" inputmode="numeric"><div id="spw"><label id="spl">${L2('Price (ETB)','ዋጋ (ብር)')}</label><input id="sp" inputmode="numeric"></div><label>${L2('Account linked with','አካውንቱ የተገናኘው ከ')}</label>${psel('sl',[['konami','Konami only'],['google','Google linked']],'konami')}<label>${L2('Region','ሪጅን')}</label>${psel('sr',[['Turkey','\u{1F1F9}\u{1F1F7} Turkey'],['Brazil','\u{1F1E7}\u{1F1F7} Brazil'],['Japan','\u{1F1EF}\u{1F1F5} Japan'],['Other','\u{1F30D} Other']],'Turkey')}<p class="fs">\u{1F512} ${L2('You will be asked for the account login only when a buyer is ready, through Messages.','የአካውንቱ መግቢያ የሚጠየቀው ገዢ ሲመጣ ብቻ ነው፣ በ Messages በኩል።')}</p><label>${L2('Description (optional)','መግለጫ (አማራጭ)')}</label><input id="sd" autocomplete="off"><div class="err" id="er"></div><button class="btn" id="ssb" onclick="sendSell()">${L2('Submit for review','ለግምገማ ላክ')}</button></div>`,'players')}
function setMode(m){$('smode').value=m;document.querySelectorAll('.mpill').forEach(b=>b.classList.toggle('on',b.dataset.m==m));$('spw').hidden=m=='swap';$('spl').textContent=m=='both'?L2('Price if sold (ETB)','በሽያጭ ዋጋ (ብር)'):L2('Price (ETB)','ዋጋ (ብር)')}
async function keepF(i){window.SF=[];for(const f of [...i.files].slice(0,4)){try{window.SF.push(new Blob([await f.arrayBuffer()],{type:f.type||'image/jpeg'}))}catch(e){window.SF.push(null);toast(L2('Could not read one of the photos. Please choose it again.','አንዱን ፎቶ ማንበብ አልተቻለም። እባክዎ እንደገና ይምረጡ።'))}}}
async function sendSell(){
 const fs=((window.SF&&window.SF.length)?window.SF:[...$('sf').files]).filter(Boolean).slice(0,4),md=$('smode').value,p=md=='swap'?0:+$('sp').value,o=+$('so').value||null;
 if(!fs.length||(md!='swap'&&!(p>0))){$('er').textContent='Add screenshots and a price.';return}
 window.SF=window.SF;$('ssb').disabled=true;$('ssb').textContent='Uploading...';
 try{const urls=[];for(const f of fs){const path=U.id+'/'+(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2))+'.jpg';let bl;try{bl=await shrink(f)}catch(x){throw new Error('IMG')}const u=await sb.storage.from('subs').upload(path,bl,{contentType:'image/jpeg'});if(u.error)throw new Error('UPLOAD: '+(u.error.message||u.error.error||'storage'));urls.push(CFG.URL+'/storage/v1/object/public/subs/'+path)}
  if(!window.SUBOK){const r=await sb.rpc('submit_account3',{p_mode:md,p_price:p,p_link:$('sl').value,p_region:$('sr').value,p_overall:o,p_descr:$('sd').value.trim()||null,p_images:urls});
  if(r.error)throw r.error;window.SMID=r.data;window.SUBOK=1}
  window.SUBOK=0;pingPush(window.SMID);
  show('<h1>Submitted!</h1><p class="sub">We will review your account and notify you in Messages.</p><button class="btn" onclick="home()">Back to home</button>','players')
 }catch(e){const m=(typeof Event!='undefined'&&e instanceof Event)?'IMG':String((e&&e.message)||e||'');$('er').textContent=/HEIC/.test(m)?'This photo is in HEIC format and could not be converted. Please use a screenshot (JPG or PNG).':/mime type/i.test(m)?'This image type is not supported. Please use JPG or PNG screenshots.':/IMG/.test(m)?'Could not read the screenshot. Please choose a normal screenshot or photo (JPG or PNG) and try again.':/NOTG/.test(m)?'Connect your Telegram first.':/LIMIT/.test(m)?'You already have 5 pending requests.':/submit_account3|schema cache/i.test(m)?'Setup incomplete: the owner must run migration25 in Supabase.':'Could not submit (v3): '+m.slice(0,100);$('ssb').disabled=false;$('ssb').textContent='Submit for review'}}
function cpy(t,b){const d=()=>{b.textContent='✅ Copied';setTimeout(()=>b.textContent='📋 Copy',1500)};navigator.clipboard?navigator.clipboard.writeText(t).then(d,()=>0):0}

async function auth(login){

 if(r.error){if(login&&/not confirmed/i.test(r.error.message)){await sb.auth.resend({type:'signup',email:PE});return verify('ኮዱ ተልኳል።')}
