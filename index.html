<!DOCTYPE html><html lang="am"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sam Store</title><link rel="stylesheet" href="style.css"></head><body><main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="config.js"></script>
<script>
const sb=supabase.createClient(CFG.URL,CFG.KEY),A=document.getElementById('app');
const CATS={ef:['⚽','eFootball Coins','ep'],pubg:['🔫','PUBG UC','id'],ff:['💎','Free Fire Diamonds','id'],gem:['✨','Gemini Premium','em']};
const ST={pending:'⏳ ክፍያ ይጠበቃል',awaiting_review:'🔎 ደረሰኝ በማረጋገጥ ላይ',approved:'✅ ተረጋግጧል፣ በማድረስ ላይ',delivered:'🎉 ደርሷል! መልካም ጨዋታ',rejected:'❌ አልተረጋገጠም፣ ድጋፍ ያግኙን'};
let cat=[],timer;
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mine=()=>JSON.parse(localStorage.getItem('sam_orders')||'[]');
const go=(h,back)=>{clearInterval(timer);A.innerHTML=(back?'<button class="back" id="bk">← ተመለስ</button>':'')+h;if(back)document.getElementById('bk').onclick=back;scrollTo(0,0)};
async function init(){
 const{data,error}=await sb.from('catalog').select('*').order('id');
 if(error){go('<p class="err">መረጃ ማምጣት አልተቻለም። እንደገና ይሞክሩ።</p>');return}
 cat=data;const o=new URLSearchParams(location.search).get('o');o?status(o):home()}
function home(){
 const ks=[...new Set(cat.map(c=>c.cat))];
 go('<h1>🛒 Sam Store</h1><p class="sub">ምርት ይምረጡ</p><div class="grid">'+ks.map(k=>`<button class="card" data-k="${k}"><b>${CATS[k][0]}</b><span>${CATS[k][1]}</span></button>`).join('')+'</div>'+(mine().length?'<button class="btn s" id="my">📋 ትዕዛዞቼ</button>':''));
 A.querySelectorAll('.card').forEach(b=>b.onclick=()=>plats(b.dataset.k));
 if(mine().length)document.getElementById('my').onclick=myOrders}
function plats(k){
 const ps=[...new Set(cat.filter(c=>c.cat==k).map(c=>c.plat))];
 if(ps[0]===null)return pkgs(k,null,home);
 go(`<h1>${CATS[k][0]} ${CATS[k][1]}</h1><p class="sub">መድረክ ይምረጡ</p><div class="rows">`+ps.map(p=>`<button class="row" data-p="${E(p)}">${E(p)} ›</button>`).join('')+'</div>',home);
 A.querySelectorAll('.row').forEach(b=>b.onclick=()=>pkgs(k,b.dataset.p,()=>plats(k)))}
function pkgs(k,p,back){
 const L=cat.filter(c=>c.cat==k&&c.plat==p);
 go(`<h1>${CATS[k][0]} ${E(L[0].title)}</h1><p class="sub">ፓኬጅ ይምረጡ</p><div class="rows">`+L.map(c=>`<button class="row" data-i="${c.id}"><span>${E(c.label)}</span><span class="p">${c.price} ETB</span></button>`).join('')+'</div>',back);
 A.querySelectorAll('.row').forEach(b=>b.onclick=()=>form(L.find(c=>c.id==b.dataset.i),back))}
function form(c,back){
 const t=CATS[c.cat][2];
 const f=t=='ep'?'<label>Konami Email</label><input id="i1" type="email" autocomplete="off"><label>Konami Password</label><input id="i2" autocomplete="off">':t=='em'?'<label>Gmail አድራሻ</label><input id="i1" type="email">':'<label>Game ID</label><input id="i1" inputmode="numeric" autocomplete="off">';
 go(`<h1>የመለያ መረጃ</h1><div class="box">${E(c.title)}<br>${E(c.label)} · <span class="p">${c.price} ETB</span></div>${f}<div class="err" id="er"></div><button class="btn" id="go">ትዕዛዝ ላክ</button>`,back);
 document.getElementById('go').onclick=async e=>{
  const a=i1.value.trim(),b=t=='ep'?i2.value.trim():'';
  if(!a||(t!='id'&&!a.includes('@'))||(t=='ep'&&!b)){er.textContent='እባክዎ ትክክለኛ መረጃ ያስገቡ።';return}
  e.target.disabled=true;
  const{data,error}=await sb.rpc('create_order',{p_id:c.id,p_info:b?a+' '+b:a});
  if(error){er.textContent='ስህተት ተፈጥሯል፣ እንደገና ይሞክሩ።';e.target.disabled=false;return}
  localStorage.setItem('sam_orders',JSON.stringify([data,...mine()]));pay(data,c)}}
async function pay(code,c){
 if(!c){const{data}=await sb.rpc('get_order',{p_code:code});c={label:data.package,price:data.amount}}
 go(`<h1>💰 ክፍያ</h1><div class="hint">ትዕዛዝ ቁጥር <b>${code}</b> (ያስቀምጡት)</div><div class="box">ወደ Telebirr <span class="big">${CFG.TELEBIRR}</span> <br>መጠን፦ <span class="big">${c.price} ETB</span></div><p>ከከፈሉ በኋላ ከታች ይሙሉ፦</p><label>የ Telebirr ግብይት ቁጥር (Transaction ID)</label><input id="tx" autocomplete="off"><label>የደረሰኝ ፎቶ (screenshot)</label><input id="fl" type="file" accept="image/*"><div class="err" id="er"></div><button class="btn" id="sd">ደረሰኝ ላክ</button>`,()=>status(code));
 sd.onclick=async()=>{
  const t=tx.value.trim(),f=fl.files[0];
  if(t.length<6||!f){er.textContent='የግብይት ቁጥር እና የደረሰኝ ፎቶ ያስፈልጋል።';return}
  sd.disabled=true;sd.textContent='በመላክ ላይ...';
  try{
   const blob=await shrink(f),path=code+'.jpg';
   const u=await sb.storage.from('receipts').upload(path,blob,{contentType:'image/jpeg'});
   if(u.error&&!/exist/i.test(u.error.message))throw u.error;
   const r=await sb.rpc('attach_receipt',{p_code:code,p_txn:t,p_path:path});
   if(r.error)throw r.error;status(code)
  }catch(x){er.textContent=/DUP/.test(x.message)?'ይህ የግብይት ቁጥር ቀደም ብሎ ጥቅም ላይ ውሏል።':'መላክ አልተቻለም፣ እንደገና ይሞክሩ።';sd.disabled=false;sd.textContent='ደረሰኝ ላክ'}}}
const shrink=f=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const s=Math.min(1,1400/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(ok,'image/jpeg',.8)};i.onerror=no;i.src=URL.createObjectURL(f)});
async function status(code){
 const draw=async()=>{
  const{data}=await sb.rpc('get_order',{p_code:code});
  if(!data){go('<p class="err">ትዕዛዝ አልተገኘም።</p><button class="btn s" id="h">መነሻ</button>');h.onclick=home;return}
  const keep=document.activeElement;
  go(`<h1>ትዕዛዝ ${data.code}</h1><div class="box">${E(data.product)}<br>${E(data.package)} · <span class="p">${data.amount} ETB</span><div class="st">${ST[data.status]}</div></div>`+(data.status=='pending'?'<button class="btn" id="pp">💰 ክፍያ ፈጽሜያለሁ፣ ደረሰኝ ላክ</button>':'')+'<button class="btn s" id="h">መነሻ ገጽ</button>');
  h.onclick=()=>{history.replaceState(0,'',location.pathname);home()};
  if(data.status=='pending')pp.onclick=()=>pay(code,{price:data.amount});
  else if(!['delivered','rejected'].includes(data.status))timer=setInterval(()=>draw(),8000)};
 await draw()}
async function myOrders(){
 go('<h1>📋 ትዕዛዞቼ</h1><div class="rows" id="ls">...</div>',home);
 const r=await Promise.all(mine().map(c=>sb.rpc('get_order',{p_code:c})));
 ls.innerHTML=r.map(x=>x.data).filter(Boolean).map(d=>`<button class="row" data-c="${d.code}"><span>${E(d.package)}<br><small>${ST[d.status]}</small></span><span class="p">${d.amount}</span></button>`).join('')||'ባዶ ነው';
 ls.querySelectorAll('.row').forEach(b=>b.onclick=()=>status(b.dataset.c))}
init();
</script></body></html>
