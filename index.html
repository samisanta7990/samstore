async function send(id){
 const c=C.find(x=>x.id==id),a=($('i1')?.value||'').trim(),b=($('i2')?.value||'').trim(),p=$('ph').value.trim();
 const nl=isA(c),info=nl?'-':c.cat=='ef'?a+' '+b:a;
 if(!nl&&(!a||(c.cat=='ef'&&!b)||((c.cat=='ef'||c.cat=='gem')&&!a.includes('@')))||!/^0[79]\d{8}$/.test(p)){$('er').textContent='እባክዎ ትክክለኛ መረጃ እና ስልክ ቁጥር ያስገቡ።';return}
 $('go').disabled=true;
 const{data,error}=await sb.rpc('create_order',{p_id:id,p_info:info,p_phone:p,p_promo:($('pr')?.value||'').trim()||null});
 if(error){$('er').textContent=ERR[(error.message.match(/LOGIN|SOLD|ONCE|PROMO|BAD/)||['BAD'])[0]];$('go').disabled=false;return}
 localStorage.samph=p;save(data,p);const g=await sb.rpc('get_order',{p_code:data,p_phone:p});pay(data,p,g.data?g.data.amount:c.price)}
function pay(code,p,price){
 show(`<h1>💰 ክፍያ</h1><div class="hint">ትዕዛዝ ቁጥር <b>${code}</b> (ያስቀምጡት)</div><div class="box">የአካውንት ስም፦ <b>${E(CFG.TELEBIRR_NAME||'')}</b><br>ወደ Telebirr <span class="big">${CFG.TELEBIRR}</span> <button class="cp" onclick="cpy('${CFG.TELEBIRR}',this)">📋 Copy</button><br>መጠን፦ <span class="big">${price} ETB</span></div><p>ከከፈሉ በኋላ የደረሰኝ ፎቶ ይላኩ፦</p><label>የደረሰኝ ፎቶ (screenshot)</label><input id="fl" type="file" accept="image/*"><div class="err" id="er"></div><button class="btn" id="sd">ደረሰኝ ላክ</button><button class="btn s" onclick="status('${code}','${p}')">በኋላ እልካለሁ</button>`,'');
 $('sd').onclick=async()=>{const f=$('fl').files[0];
  if(!f){$('er').textContent='የደረሰኝ ፎቶ ያስፈልጋል።';return}
  $('sd').disabled=true;$('sd').textContent='በመላክ ላይ...';
  try{const blob=await shrink(f),path=code+'.jpg',h=[...new Uint8Array(await crypto.subtle.digest('SHA-256',await blob.arrayBuffer()))].map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,24);
   const u=await sb.storage.from('receipts').upload(path,blob,{contentType:'image/jpeg'});
   if(u.error&&!/exist/i.test(u.error.message))throw u.error;
   const r=await sb.rpc('attach_receipt',{p_code:code,p_txn:h,p_path:path});if(r.error)throw r.error;status(code,p)
  }catch(x){$('er').textContent=/DUP/.test(x.message)?'ይህ ደረሰኝ ቀደም ብሎ ጥቅም ላይ ውሏል።':'መላክ አልተቻለም፣ እንደገና ይሞክሩ።';$('sd').disabled=false;$('sd').textContent='ደረሰኝ ላክ'}}}
const shrink=f=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const s=Math.min(1,1400/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(ok,'image/jpeg',.8)};i.onerror=no;i.src=URL.createObjectURL(f)});
async function status(code,p){
 let LS='';const d=async()=>{if($('kc')&&$('kc').value)return;const{data}=await sb.rpc('get_order',{p_code:code,p_phone:p});const J=JSON.stringify(data);if(data&&J===LS)return;LS=J;
  if(!data){show('<p class="err">ትዕዛዝ አልተገኘም። ቁጥሩን እና ስልኩን ያረጋግጡ።</p><button class="btn s" onclick="account()">ተመለስ</button>','acc');return}
  show(`<h1>ትዕዛዝ ${data.code}</h1><div class="box">${E(data.product)}<br>${E(data.package)} · <span class="p">${data.amount} ETB</span><div class="st">${ST[data.status]}</div></div>`+(data.status=='pending'?`<button class="btn" onclick="pay('${code}','${p}',${data.amount})">💰 ክፍያ ፈጽሜያለሁ፣ ደረሰኝ ላክ</button>`:'')+(data.proof?`<div class="box"><b>📸 የማድረስ ማረጋገጫ</b><img src="${CFG.URL}/storage/v1/object/public/proofs/${data.proof}" style="width:100%;border-radius:12px;margin-top:8px"></div>`:'')+(data.code_req?`<div class="hint">🔐 Konami ወደ ኢሜልዎ የላከውን የማረጋገጫ ኮድ ያስገቡ</div><input id="kc" autocomplete="off" placeholder="Code"><div class="err" id="er"></div><button class="btn" onclick="sendKc('${code}','${p}')">ኮድ ላክ</button>`:'')+'<button class="btn s" onclick="home()">መነሻ</button>','acc');
  if(!['delivered','rejected','pending'].includes(data.status))T=setInterval(d,8000)};
 await d()}
async function promo(id){const c=C.find(x=>x.id==id),v=($('pr').value||'').trim();if(!v){$('pm').textContent='';return}

async function sendKc(c,p){const v=$('kc').value.trim();if(!/^[A-Za-z0-9]{4,10}$/.test(v)){$('er').textContent='ኮዱ ትክክል አይደለም።';return}

let PE='';

 if(/invalid format|validate email|valid email/i.test(m))return 'ሙሉ ኢሜል ያስገቡ (ለምሳሌ name@gmail.com)።';

 if(/rate|too many|seconds/i.test(m))return 'ብዙ ጊዜ ሞክረዋል፣ ትንሽ ቆይተው ይሞክሩ።';

 return 'አካውንት መክፈት አልተቻለም፦ '+m}
async function auth(login){
 const c={email:$('ae').value.trim(),password:$('ap').value};PE=c.email;
 const r=login?await sb.auth.signInWithPassword(c):await sb.auth.signUp(c);
 if(r.error){if(login&&/not confirmed/i.test(r.error.message)){await sb.auth.resend({type:'signup',email:PE});return verify('ኮዱ ተልኳል።')}
  $('er').textContent=aerr(login,r.error);return}
 if(!r.data.session)return verify();
 account()}
function verify(m=''){show(`<button class="back" onclick="account()">← ተመለስ</button><h1>📧 ኢሜልዎን ያረጋግጡ</h1><p class="sub">የማረጋገጫ ኮድ ወደ ኢሜልዎ ተልኳል፦ <b>${E(PE)}</b></p><label>የማረጋገጫ ኮድ</label><input id="vc" inputmode="numeric" autocomplete="one-time-code"><div class="err" id="er" style="color:var(--ok)">${m}</div><button class="btn" onclick="vfy()">አረጋግጥ</button><button class="btn s" onclick="rsd()">ኮዱን እንደገና ላክ</button>`,'acc')}

async function fsend(){PE=$('fe').value.trim();if(!PE.includes('@')){$('er').textContent='Enter your full email address.';return}
 const r=await sb.auth.resetPasswordForEmail(PE);if(r.error){$('er').textContent='Could not send the code: '+r.error.message;return}fcode()}
function fcode(m=''){show(`<button class="back" onclick="forgot()">← Back</button><h1>Enter the code</h1><p class="sub">We sent a code to <b>${E(PE)}</b></p><label>Code</label><input id="fc" inputmode="numeric" autocomplete="one-time-code"><label>New password (6+ characters)</label><input id="fp" type="password"><div class="err" id="er">${m}</div><button class="btn" onclick="fset()">Save new password</button>`,'acc')}
async function fset(){const t=($('fc').value||'').replace(/\s/g,''),p=$('fp').value;if(p.length<6){$('er').textContent='Password must be 6+ characters.';return}
 const v=await sb.auth.verifyOtp({email:PE,token:t,type:'recovery'});if(v.error){$('er').textContent='Invalid or expired code.';return}
 const u=await sb.auth.updateUser({password:p});if(u.error){$('er').textContent='Could not set the password, try again.';return}account()}
function tgLogin(){const el=$('tgl');if(!el)return;const s=document.createElement('script');s.async=true;s.src='https://telegram.org/js/telegram-widget.js?22';s.dataset.telegramLogin=CFG.BOT||'samstoreet_bot';s.dataset.size='large';s.dataset.userpic='false';s.dataset.requestAccess='write';s.dataset.onauth='onTgLogin(user)';el.appendChild(s)}
async function onTgLogin(u){const e=$('er');try{const r=await fetch('/tglogin',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(u)});const d=await r.json();
 if(!r.ok||!d.access_token){if(e)e.textContent=d.error||'Telegram login failed.';return}
 await sb.auth.setSession({access_token:d.access_token,refresh_token:d.refresh_token});if(u.photo_url)await sb.auth.updateUser({data:{tg_photo:u.photo_url}});account()}catch(x){if(e)e.textContent='Telegram login failed, try again.'}}
async function out(){await sb.auth.signOut();U=null;account()}
MO.observe(document.body,{childList:true,subtree:true});tr();
(async()=>{if(!await load()){V.innerHTML='<p class="err">መረጃ ማምጣት አልተቻለም።</p>';return}
 const{data}=await sb.auth.getSession();U=data.session?.user||null;new URLSearchParams(location.search).get('acc')?account():home()})();
