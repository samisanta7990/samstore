<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messages · Admin</title>
<link rel="stylesheet" href="style.css"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#0b0f17;color:#ecedf3;font:15px/1.5 'Outfit',system-ui,sans-serif}main{max-width:560px;margin:auto;padding:16px 14px 160px}a{color:#F2B705}
h1{font-size:22px;margin:4px 0 12px}.sub{color:#8c90a6}.btn{background:#F2B705;color:#000;border:0;border-radius:14px;padding:12px 16px;font:600 15px Outfit,system-ui,sans-serif;cursor:pointer}.btn.s{background:#181a26;color:#ecedf3;border:1px solid #ffffff1f}
input{width:100%;background:#11121b;border:1px solid #ffffff1f;border-radius:14px;color:#ecedf3;padding:12px 14px;font:15px Outfit,system-ui,sans-serif}
.mrow{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:#181a26;border:1px solid #ffffff14;margin-bottom:10px;cursor:pointer}.mt{flex:1;min-width:0}.mt b,.mt small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.udot{min-width:20px;height:20px;border-radius:99px;background:#ef4444;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.chh{display:flex;align-items:center;gap:12px;margin-bottom:12px}.cms{display:flex;flex-direction:column;gap:8px}.bub{max-width:82%;padding:9px 13px;border-radius:16px;background:#181a26;border:1px solid #ffffff14;word-break:break-word;white-space:pre-wrap;align-self:flex-start}.bub.me{align-self:flex-end;background:linear-gradient(135deg,#F2B705,#e0a400);color:#000;border-color:transparent}.bub small{display:block;opacity:.6;font-size:11px;margin-top:3px;text-align:right}.sysb{align-self:center;max-width:92%;text-align:center;background:#F2B7051a;border:1px solid #F2B70544;border-radius:14px;padding:10px 14px}
.cin{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(8,12,20,.96);max-width:560px;margin:auto}.cin input{flex:1}</style></head><body><main id="v"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="config.js"></script>
<script>
const sb=supabase.createClient(CFG.URL,CFG.KEY),V=document.getElementById('v'),$=i=>document.getElementById(i),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const VAPID='BP-ef-keWlKpWMIxRGi6uNWNgDQrvDF4TefX8KIbWyxQkWXuT9K4RPPIcTwymdD4alFypxZzopjaYWtTfCd45UM';let T=null,UID=null;
const tmo=t=>{const d=new Date(t),n=new Date();return d.toDateString()==n.toDateString()?d.toTimeString().slice(0,5):d.toLocaleDateString()+' '+d.toTimeString().slice(0,5)};
const u8=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
async function enablePush(){try{if(!('PushManager' in window))return alert('Push is not supported here.');const p=await Notification.requestPermission();if(p!=='granted')return alert('Notifications were not allowed.');const reg=await navigator.serviceWorker.ready;let s=await reg.pushManager.getSubscription();if(!s)s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(VAPID)});const j=s.toJSON();const r=await sb.rpc('save_push',{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth});alert(r.error?'Could not save: '+r.error.message:'Notifications are ON for this phone.')}catch(e){alert('Error: '+e.message)}}
async function pingPush(mid){try{const s=(await sb.auth.getSession()).data.session;if(s&&mid)fetch('/notifypush',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+s.access_token},body:JSON.stringify({msg_id:mid})})}catch(e){}}
async function init(){const{data:{session}}=await sb.auth.getSession();if(!session){V.innerHTML='<h1>Messages</h1><p class="sub">Open <a href="admin.html">admin.html</a>, log in, then come back here.</p>';return}UID=session.user.id;const a=await sb.rpc('is_admin');if(a.error||!a.data){V.innerHTML='<h1>Messages</h1><p class="sub">This account is not an admin.</p>';return}list();setInterval(()=>{if(!window.CID)list(true)},8000)}
async function list(quiet){window.CID=null;clearInterval(T);const{data,error}=await sb.rpc('admin_convs');if(error){V.innerHTML='<p class="sub">Could not load: '+E(error.message)+' (run migration24)</p>';return}
 V.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center"><h1>Messages</h1><span><button class="btn s" onclick="enablePush()">\u{1F514}</button> <a class="btn s" style="text-decoration:none;display:inline-block" href="admin.html">\u2190</a></span></div>'+((data||[]).map(c=>`<div class="mrow" onclick="chat(${c.id})"><div class="mt"><b>${E(c.title)}</b><small class="sub">${E(c.last_text||'')}</small></div><div style="text-align:right"><small class="sub">${tmo(c.last_at)}</small>${c.unread>0?`<div class="udot">${c.unread}</div>`:''}</div></div>`).join('')||'<p class="sub">No conversations yet.</p>')}
async function chat(id){window.CID=id;window.LASTN=-1;const t=((await sb.rpc('conv_info',{p_conv:id})).data||{}).title||'Chat';
 V.innerHTML=`<div class="chh"><button class="btn s" onclick="list()">\u2190</button><b>${E(t)}</b></div><div id="cm" class="cms"></div><div class="cin"><input id="ci" maxlength="1000" autocomplete="off" placeholder="Reply as SAM STORE\u2026"><button class="btn" onclick="sendM()">\u27A4</button></div>`;
 const go=async()=>{const{data:ms}=await sb.from('messages').select('*').eq('conv_id',id).order('id');if(!ms||ms.length===window.LASTN)return;window.LASTN=ms.length;$('cm').innerHTML=ms.map(m=>{const U0=CFG.URL+'/storage/v1/object/public/chat/';if(m.kind=='image')return `<div class="bub${m.role=='admin'?' me':''}"><a href="${U0+m.meta.path}" target="_blank"><img src="${U0+m.meta.path}" style="max-width:100%;max-height:240px;border-radius:12px"></a><small>${tmo(m.created_at)}</small></div>`;if(m.kind=='exchange_offer')return `<div class="sysb"><b>Exchange offer</b><br>${E(m.meta.mode)} ${m.meta.amount||0} ETB \u00b7 OVR ${E(m.meta.ovr||'')}<br>${E(m.meta.note||'')}<div>${(m.meta.images||[]).map(q=>`<a href="${U0+q}" target="_blank"><img src="${U0+q}" style="width:72px;height:72px;object-fit:cover;border-radius:8px;margin:4px"></a>`).join('')}</div></div>`;if(m.kind!='text')return `<div class="sysb">${E(m.body)}${m.meta&&m.meta.price?' \u00b7 '+m.meta.price+' ETB':''}</div>`;return `<div class="bub${m.role=='admin'?' me':''}">${m.role=='buyer'||m.role=='seller'?'<small style="text-align:left;opacity:.7">'+m.role+'</small>':''}${E(m.body)}<small>${tmo(m.created_at)}</small></div>`}).join('');scrollTo(0,document.body.scrollHeight);sb.rpc('mark_read',{p_conv:id})};
 window.go=go;await go();T=setInterval(go,3000);$('ci').addEventListener('keydown',e=>{if(e.key==='Enter')sendM()})}
async function sendM(){const i=$('ci'),v=i.value.trim();if(!v)return;i.value='';const{data,error}=await sb.rpc('send_message',{p_conv:window.CID,p_body:v});if(error){i.value=v;alert('Could not send: '+error.message);return}window.LASTN=-1;window.go();pingPush(data)}
init();
</script></body></html>
