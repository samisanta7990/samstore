<!DOCTYPE html><html lang="am"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link rel="stylesheet" href="style.css"><meta name="robots" content="noindex"></head><body><main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="config.js"></script>
<script>
const sb=supabase.createClient(CFG.URL,CFG.KEY),A=document.getElementById('app'),$=i=>document.getElementById(i);
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let me,tab='awaiting_review',rows=[],promos=[],lists=[],subs=[],last=-1,tm;
const TABS={awaiting_review:'🔎 ለማረጋገጥ',approved:'📦 ለማድረስ',delivered:'✅ ደርሷል',rejected:'❌ ውድቅ',codes:'🎟 Codes',lst:'➕ Listings',subs:'📥 Sell requests'};
function login(m=''){
 clearInterval(tm);A.innerHTML=`<h1>🔐 Admin</h1><label>Email</label><input id="em" type="email"><label>Password</label><input id="pw" type="password"><div class="err">${m}</div><button class="btn" id="lg">ግባ</button>`;
 lg.onclick=async()=>{const{error}=await sb.auth.signInWithPassword({email:em.value.trim(),password:pw.value});error?login('ኢሜል ወይም ይለፍ ቃል ትክክል አይደለም'):start()}}
async function start(){
 const{data}=await sb.auth.getSession();if(!data.session)return login();
 me=data.session.user.id;const ok=await sb.rpc('is_admin');if(!ok.data){await sb.auth.signOut();return login('ይህ መለያ አድሚን አይደለም')}await load();clearInterval(tm);tm=setInterval(load,6000)}
function beep(){try{const c=new AudioContext(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();o.stop(c.currentTime+.3)}catch{}}
async function load(){
 const{data,error}=await sb.from('orders').select('*').order('id',{ascending:false}).limit(150);
 if(error)return login('እንደገና ይግቡ');rows=data;
 const n=rows.filter(o=>o.status=='awaiting_review'||(o.status=='approved'&&!o.claimed_by)).length;
 if(last>=0&&n>last)beep();last=n;document.title=n?`(${n}) Admin`:'Admin';const pr=await sb.from('promo').select('*').order('created_at',{ascending:false});promos=pr.data||[];const lr=await sb.from('catalog').select('*').in('cat',['player','manager','account']).order('id',{ascending:false});lists=lr.data||[];const sr=await sb.from('submissions').select('*').order('id',{ascending:false}).limit(60);subs=sr.data||[];if((tab=='codes'||tab=='lst')&&document.activeElement&&['INPUT','SELECT'].includes(document.activeElement.tagName))return;draw()}
function draw(){
 const L=rows.filter(o=>o.status==tab);
 const cnt=s=>s=='subs'?subs.filter(x=>x.status=='pending').length:s=='lst'?lists.length:s=='codes'?promos.length:rows.filter(o=>o.status==s).length;
 A.innerHTML='<h1>📋 ትዕዛዞች</h1><div class="tabs">'+Object.entries(TABS).map(([k,v])=>`<button data-t="${k}" class="${k==tab?'on':''}">${v} (${cnt(k)})</button>`).join('')+'<button id="lo">ውጣ</button></div>'+(tab=='subs'?subUI():tab=='lst'?lstUI():tab=='codes'?codesUI():L.map(card).join('')||'<p class="sub">ምንም የለም</p>');
 A.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw()});
 lo.onclick=async()=>{await sb.auth.signOut();login()};
 A.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(confirm('ይሰረዝ?')){await sb.rpc('delete_promo',{p_code:b.dataset.d});load()}});
 A.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(b));
 A.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>receipt(b))}
const shrinkR=(f,deg)=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const s=Math.min(1,1200/Math.max(i.width,i.height)),w=i.width*s,h=i.height*s,r=deg%180!=0,c=document.createElement('canvas');c.width=r?h:w;c.height=r?w:h;const x=c.getContext('2d');x.translate(c.width/2,c.height/2);x.rotate(-deg*Math.PI/180);x.drawImage(i,-w/2,-h/2,w,h);c.toBlob(ok,'image/jpeg',.85)};i.onerror=no;i.src=URL.createObjectURL(f)});
function lstUI(){return `<div class="box"><label style="margin-top:0">ዓይነት</label><select id="lc"><option value="player">Player</option><option value="account">Account (ሌላ)</option></select><label>ስም</label><input id="lt" autocomplete="off"><label>መግለጫ (ለምሳሌ GK 105)</label><input id="ll" autocomplete="off"><label>ዋጋ (ETB)</label><input id="lp" inputmode="numeric"><label>ክምችት</label><input id="ls" inputmode="numeric" value="1"><label>ፎቶ</label><input id="li" type="file" accept="image/*"><label>ፎቶ ማዞሪያ</label><select id="lr"><option value="0">አይዞር</option><option value="90">90° ወደ ግራ ↺</option><option value="270">90° ወደ ቀኝ ↻</option><option value="180">180°</option></select><div class="err" id="le"></div><button class="btn" onclick="addL()">➕ ለጥፍ</button></div>`+lists.map(l=>`<div class="box o">${l.img?`<img src="${E(l.img)}" style="max-height:150px;object-fit:contain">`:''}<b>${E(l.title)}</b> <small>${E(l.cat)} · ${E(l.label)}</small><label>ዋጋ (ETB)</label><input id="up${l.id}" inputmode="numeric" value="${l.price}"><label>ክምችት</label><input id="us${l.id}" inputmode="numeric" value="${l.stock??0}"><div class="mini"><button class="btn" onclick="updL(${l.id})">💾 አስቀምጥ</button><button class="btn s" onclick="delL(${l.id})">🗑 ሰርዝ</button></div></div>`).join('')}
async function addL(){const f=$('li').files[0],t=$('lt').value.trim(),p=+$('lp').value;if(!t||!(p>0)){$('le').textContent='ስም እና ዋጋ ያስገቡ።';return}
 let img=null;if(f){const path='l-'+crypto.randomUUID()+'.jpg';const u=await sb.storage.from('proofs').upload(path,await shrinkR(f,+$('lr').value),{contentType:'image/jpeg'});if(u.error){$('le').textContent='ፎቶ መስቀል አልተቻለም።';return}img=CFG.URL+'/storage/v1/object/public/proofs/'+path}
 const r=await sb.rpc('add_listing',{p_cat:$('lc').value,p_title:t,p_label:$('ll').value,p_price:p,p_stock:+$('ls').value||0,p_img:img});
 if(r.error){$('le').textContent='አልተሳካም (migration7 ሮጧል?)';return}load()}
async function updL(id){const r=await sb.rpc('update_listing',{p_id:id,p_price:+$('up'+id).value,p_stock:+$('us'+id).value||0});if(r.error)alert('አልተሳካም');load()}
async function delL(id){if(confirm('ይሰረዝ?')){await sb.rpc('delete_listing',{p_id:id});load()}}
function codesUI(){return `<div class="box"><label style="margin-top:0">ኮድ (ባዶ ከሆነ በራሱ ይፈጠራል)</label><input id="pc" autocomplete="off"><label>ቅናሽ (ETB)</label><input id="pd" inputmode="numeric" value="50"><label>ስንት ጊዜ ይሰራ</label><input id="pm" inputmode="numeric" value="1"><div class="err" id="pe"></div><button class="btn" onclick="mk()">➕ ኮድ ፍጠር</button></div>`+promos.map(p=>`<div class="box o"><code style="font-size:18px">${E(p.code)}</code> · −${p.discount} ETB · ${p.used}/${p.max_uses}<button class="btn s" data-d="${E(p.code)}">🗑 ሰርዝ</button></div>`).join('')}
async function mk(){const r=await sb.rpc('create_promo',{p_code:$('pc').value,p_discount:+$('pd').value,p_max:+$('pm').value});if(r.error){$('pe').textContent='አልተሳካም (ኮዱ ተይዞ ሊሆን ይችላል)';return}load()}
const shrink=f=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const s=Math.min(1,1400/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(ok,'image/jpeg',.8)};i.onerror=no;i.src=URL.createObjectURL(f)});
async function finish(id){const f=$('pf'+id)&&$('pf'+id).files[0];let path=null;
 if(f){path=crypto.randomUUID()+'.jpg';const u=await sb.storage.from('proofs').upload(path,await shrink(f),{contentType:'image/jpeg'});if(u.error){alert('ፎቶ መስቀል አልተቻለም፣ እንደገና ይሞክሩ');return}}
 const r=await sb.rpc('deliver_order',{p_id:id,p_proof:path});if(r.error||!r.data)alert('አልተሳካም');await load()}
const cpb=t=>`<button class="cp" data-t="${E(t)}" onclick="cpx(this)">📋</button>`;
function cpx(b){if(navigator.clipboard)navigator.clipboard.writeText(b.dataset.t);b.textContent='✅';setTimeout(()=>b.textContent='📋',1200)}
function infoH(o){const i=(o.info||'').indexOf(' ');if(o.cat=='ef'&&i>0){const e=o.info.slice(0,i),p=o.info.slice(i+1);return `<br>📧 <code>${E(e)}</code> ${cpb(e)}<br>🔑 <code>${E(p)}</code> ${cpb(p)}`}return `<br>🔑 <code>${E(o.info)}</code> ${cpb(o.info)}`}
async function ns(id){const r=await sb.rpc('notify_seller',{p_order:id});alert(r.error?'Failed (run migration8)':r.data)}
function subUI(){return subs.map(s=>`<div class="box o"><b>#${s.id}</b> · ${E(s.status)} · ${s.price} ETB<br>${E(s.region)} · ${s.link_type=='google'?'Google linked':'Konami only'} · OVR ${s.overall||'-'}<br>✈️ ${E(s.tg)}${s.descr?`<br>${E(s.descr)}`:''}<div class="thumbs">${(s.images||[]).map(u=>`<a href="${E(u)}" target="_blank"><img src="${E(u)}"></a>`).join('')}</div>${s.status=='pending'?`<div class="mini"><button class="btn" onclick="apS(${s.id},${s.price})">✅ List it</button><button class="btn s" onclick="rjS(${s.id})">❌ Reject</button></div>`:''}</div>`).join('')||'<p class="sub">Nothing here</p>'}
async function apS(id,p){const v=prompt('Listing price (ETB)',p);if(!v)return;const r=await sb.rpc('approve_submission',{p_id:id,p_price:+v});if(r.error)alert('Failed');load()}
async function rjS(id){if(confirm('Reject this request?')){await sb.rpc('reject_submission',{p_id:id});load()}}
function card(o){
 let b='';
 if(o.status=='awaiting_review')b=`<div class="mini"><button class="btn" data-a="ok" data-id="${o.id}">✅ አጽድቅ</button><button class="btn s" data-a="no" data-id="${o.id}">❌ አትቀበል</button></div>`;
 if(o.status=='approved')b=!o.claimed_by?`<button class="btn" data-a="claim" data-id="${o.id}">🙋 እኔ አደርሳለሁ</button>`:o.claimed_by==me?`${o.cat=='ef'?`${o.kcode?`<div class="hint">🔐 Konami code፦ <b style="font-size:20px">${E(o.kcode)}</b> ${cpb(o.kcode)}</div>`:o.code_req?'<p>⏳ ደንበኛው ኮዱን እየላከ ነው...</p>':''}<button class="btn s" data-a="req" data-id="${o.id}">🔐 ኮድ ጠይቅ</button>`:''}<label>📸 የማድረስ ማረጋገጫ ፎቶ (አማራጭ፣ ደንበኛው ያየዋል)</label><input type="file" accept="image/*" id="pf${o.id}"><button class="btn" onclick="finish(${o.id})">✅ ደርሷል</button>`:`<p>🔒 በ ${E(o.claimed_by_name)} ተይዟል</p>`;
 return `<div class="box o"><b>#${o.id}</b> · <code>${o.code}</code> · <small>${new Date(o.created_at).toLocaleString()}</small><br>${E(o.product)} — ${E(o.package)}<br>💰 <span class="p">${o.amount} ETB</span>${o.promo?` 🎟 ${E(o.promo)} (−${o.discount})`:''}<br>📞 ${E(o.phone)}${infoH(o)}${o.tg?`<br>✈️ ${E(o.tg)}`:''}${(()=>{const l=lists.find(x=>x.id==o.catalog_id);return l&&l.seller_tg?`<br>🧑‍💼 Seller ${E(l.seller_tg)} <button class="cp" onclick="ns(${o.id})">📣 Notify seller</button>`:''})()}${o.proof?`<br><img src="${CFG.URL}/storage/v1/object/public/proofs/${o.proof}">`:''}`+(o.receipt_path?`<br><button class="btn s" data-r="${o.receipt_path}" style="margin-top:8px">🖼 ደረሰኝ አሳይ</button><div></div>`:'')+b+'</div>'}
async function receipt(b){
 const{data}=await sb.storage.from('receipts').createSignedUrl(b.dataset.r,300);
 if(data)b.nextElementSibling.innerHTML=`<img src="${data.signedUrl}">`}
async function act(b){
 const id=+b.dataset.id,a=b.dataset.a;
 if(a=='no'&&!confirm('ውድቅ ይደረግ?'))return;
 b.disabled=true;
 const[fn,args]={ok:['review_order',{p_id:id,p_ok:true}],no:['review_order',{p_id:id,p_ok:false}],claim:['claim_order',{p_id:id}],req:['request_code',{p_id:id}],done:['deliver_order',{p_id:id}]}[a];
 const{data,error}=await sb.rpc(fn,args);
 if(error||!data)alert('አልተሳካም (ሌላ ሰው ቀድሞ ይዞት ሊሆን ይችላል)');
 await load()}
start();
</script></body></html>
